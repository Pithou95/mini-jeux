<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-jeux</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="conteneur">
    <h1>Mini-jeux</h1>

    <!-- Écran 1 : accueil (pseudo, créer ou rejoindre) -->
    <div id="accueil">
      <input id="champPseudo" maxlength="15" placeholder="Ton pseudo">
      <div class="ligne">
        <button id="boutonCreer">Créer un salon</button>
      </div>
      <div class="ligne">
        <input id="champCode" maxlength="4" placeholder="Code du salon">
        <button id="boutonRejoindre">Rejoindre</button>
      </div>
    </div>

    <!-- Messages : connexion, erreurs, informations -->
    <p id="infoSalon"></p>

    <!-- Écran 2 : salle d'attente -->
    <div id="salle" class="cache">
      <h2>Salle d'attente</h2>
      <p id="codeSalon"></p>
      <ul id="listeJoueurs"></ul>

      <!-- Commandes visibles seulement par l'hôte -->
      <div id="commandesHote" class="cache">
        <div class="ligne">
          <label for="choixJeu">Jeu :</label>
          <select id="choixJeu"></select>
        </div>
        <p id="infoMinimum"></p>
        <div class="ligne">
          <button id="boutonLancer">Lancer la partie</button>
        </div>
      </div>

      <!-- Message visible seulement par les invités -->
      <p id="attenteHote" class="cache"></p>
    </div>

    <!-- Écran 3 : la partie (le contenu est dessiné par le fichier du jeu) -->
    <div id="jeu" class="cache">
      <div id="zoneJeu"></div>
      <div class="ligne">
        <button id="rejouer" class="cache">Rejouer</button>
        <button id="boutonSalle" class="cache">Retour à la salle</button>
      </div>
    </div>

  <!-- PeerJS doit être chargé avant main.js -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
